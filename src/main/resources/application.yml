spring:
  application:
    name: finance-tracker

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    expiration-minutes: 1440
  pagination:
    default-page-size: 20
    max-page-size: 100
